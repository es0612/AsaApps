name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4.1)
          # model: "claude-opus-4-1-20250805"
          
          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
          
          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"
          
          # SwiftUI/iOS開発で使用するコマンドを許可
          allowed_tools: "Bash(xcodebuild -project * -scheme *),Bash(swift --version),Bash(swiftlint),Bash(xcrun simctl *),Bash(plutil *),Bash(find Apps/ -name *.swift),Bash(grep -r * Apps/),Bash(open *.xcodeproj)"
          
          # AsaAppsプロジェクト向けカスタム指示
          custom_instructions: |
            AsaAppsプロジェクト（朝活パパエンジニアの100個SwiftUIアプリプロジェクト）での作業です。
            
            重要な指針：
            - 全ての対応を日本語で実施してください
            - CLAUDE.mdのプロジェクト指針を必ず参照してください
            - ブランドカラー（AsaCoffeeBrown、AsaMocha等）の使用を推奨
            - 共有コンポーネント（AsaButton、AsaCard、AsaLaunchScreen）を積極的に活用
            - MVVMアーキテクチャパターンに従った実装
            - @Observableや@StateなどモダンなSwiftUI技術の使用
            - 家族向け・生産性重視のテーマを維持
            - コメントとドキュメントは日本語で記述
          
          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test

