name: AsaMealPlanner
options:
  bundleIdPrefix: com.asapapa.lab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  generateEmptyDirectories: true
  
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
  # SwiftUI specific settings - No Storyboard
  UILaunchStoryboardName: ""
  UIMainStoryboardFile: ""
  UIMainStoryboardFile~ipad: ""  
targets:
  AsaMealPlanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AsaMealPlanner
      - ../../Shared
    resources:
      - AsaMealPlanner/Resources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.lab.AsaMealPlanner
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: AsaMealPlanner/Info.plist
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY[config=Debug]: ""
      PROVISIONING_PROFILE_SPECIFIER[config=Debug]: ""
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # System frameworks
      - sdk: SwiftData.framework
      - sdk: SwiftUI.framework
    preBuildScripts:
      - script: |
          # プロジェクトビルド情報出力
          echo "Building AsaMealPlanner..."
          echo "SwiftData support enabled"
        name: "Build Info"

fileGroups:
  - AsaMealPlanner/App
  - AsaMealPlanner/Models
  - AsaMealPlanner/Services
  - AsaMealPlanner/Views
  - AsaMealPlanner/Resources

schemes:
  AsaMealPlanner:
    build:
      targets:
        AsaMealPlanner: all
    run:
      config: Debug
    archive:
      config: Release