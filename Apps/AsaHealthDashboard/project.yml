name: AsaHealthDashboard
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  AsaHealthDashboard:
    type: application
    platform: iOS
    sources:
      - AsaHealthDashboard
    entitlements:
      path: AsaHealthDashboard/AsaHealthDashboard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asahealthdashboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "健康データをダッシュボードに表示し、日々の健康状態を可視化するために使用します"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: HealthKit.framework

  AsaHealthDashboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AsaHealthDashboardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asahealthdashboard.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: AsaHealthDashboard

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit
