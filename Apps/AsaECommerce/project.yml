name: AsaECommerce
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaECommerce:
    type: application
    platform: iOS
    sources:
      - AsaECommerce
    resources:
      - AsaECommerce/Assets.xcassets
      - AsaECommerce/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaecommerce
      INFOPLIST_FILE: AsaECommerce/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework

  AsaECommerceTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaECommerceTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaecommerce.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaECommerce
