name: AsaWeatherHistory
options:
  bundleIdPrefix: com.asapapa.lab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  
targets:
  AsaWeatherHistory:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AsaWeatherHistory
    resources:
      - AsaWeatherHistory/Resources/Assets.xcassets
      - AsaWeatherHistory/Models/WeatherHistoryModel.xcdatamodeld
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.lab.AsaWeatherHistory
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: AsaWeatherHistory/Info.plist
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      # System frameworks
      - sdk: CoreData.framework
      - sdk: CoreLocation.framework
      - sdk: Charts.framework
    preBuildScripts:
      - script: |
          # Core Data model compilation
          if [ -f "$SRCROOT/AsaWeatherHistory/Models/WeatherHistoryModel.xcdatamodeld" ]; then
            echo "Core Data model found"
          fi
        name: "Check Core Data Model"

fileGroups:
  - AsaWeatherHistory/App
  - AsaWeatherHistory/Models
  - AsaWeatherHistory/Services
  - AsaWeatherHistory/Views
  - AsaWeatherHistory/Resources


schemes:
  AsaWeatherHistory:
    build:
      targets:
        AsaWeatherHistory: all
    run:
      config: Debug
    archive:
      config: Release