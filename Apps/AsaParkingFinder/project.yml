name: AsaParkingFinder
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaParkingFinder:
    type: application
    platform: iOS
    sources: 
      - AsaParkingFinder
    resources:
      - AsaParkingFinder/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaparkingfinder
      INFOPLIST_FILE: AsaParkingFinder/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "現在地周辺の駐車場を検索するために位置情報を使用します"
      INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "現在地周辺の駐車場を検索するために位置情報を使用します"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: SwiftUI.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework

  AsaParkingFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaParkingFinderTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaparkingfinder.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaParkingFinder

  AsaParkingFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaParkingFinderUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaparkingfinder.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaParkingFinder