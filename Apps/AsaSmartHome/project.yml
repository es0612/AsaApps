name: AsaSmartHome
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  AsaSmartHome:
    type: application
    platform: iOS
    sources:
      - path: AsaSmartHome
        excludes:
          - "**/.DS_Store"
    settings:
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_CFBundleDisplayName: "AsaSmartHome"
      SWIFT_EMIT_LOC_STRINGS: true
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaSmartHome
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

  AsaSmartHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AsaSmartHomeTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: AsaSmartHome
    settings:
      GENERATE_INFOPLIST_FILE: true
      BUNDLE_LOADER: "$(TEST_HOST)"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AsaSmartHome.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AsaSmartHome"

  AsaSmartHomeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AsaSmartHomeUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: AsaSmartHome
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_TARGET_NAME: AsaSmartHome

schemes:
  AsaSmartHome:
    build:
      targets:
        AsaSmartHome: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AsaSmartHomeTests
        - AsaSmartHomeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
