name: AsaFamilyAlbum
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaFamilyAlbum:
    type: application
    platform: iOS
    sources: 
      - AsaFamilyAlbum
    resources:
      - AsaFamilyAlbum/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asafamilyalbum
      INFOPLIST_FILE: AsaFamilyAlbum/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "家族の写真を整理・管理するため、フォトライブラリへのアクセスが必要です。"
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "写真をアルバムに追加するため、フォトライブラリへの書き込みアクセスが必要です。"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: Photos.framework

  AsaFamilyAlbumTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaFamilyAlbumTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asafamilyalbum.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaFamilyAlbum

  AsaFamilyAlbumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaFamilyAlbumUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asafamilyalbum.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaFamilyAlbum