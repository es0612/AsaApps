name: AsaSmartTodo
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"

targets:
  AsaSmartTodo:
    type: application
    platform: iOS
    sources:
      - AsaSmartTodo
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - package: AsaTaskKit
        product: AsaTaskKit
      - framework: CoreML.framework
    settings:
      SWIFT_VERSION: "5.9"
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaSmartTodo
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: AsaSmartTodo/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"

  AsaSmartTodoTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaSmartTodoTests
    dependencies:
      - target: AsaSmartTodo
    settings:
      SWIFT_VERSION: "5.9"

  AsaSmartTodoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaSmartTodoUITests
    dependencies:
      - target: AsaSmartTodo
    settings:
      SWIFT_VERSION: "5.9"

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit
  AsaTaskKit:
    path: ../../Packages/AsaTaskKit