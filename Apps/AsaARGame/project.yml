name: AsaARGame
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.9"

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaARGame:
    type: application
    platform: iOS
    sources:
      - AsaARGame
    resources:
      - AsaARGame/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaargame
      INFOPLIST_FILE: AsaARGame/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: SwiftUI.framework
      - sdk: RealityKit.framework
      - sdk: ARKit.framework

  AsaARGameTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaARGameTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaargame.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaARGame

  AsaARGameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaARGameUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaargame.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaARGame
