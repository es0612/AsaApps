name: AsaCrowdsource
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  AsaCrowdsource:
    type: application
    platform: iOS
    sources:
      - path: AsaCrowdsource
        excludes:
          - "**/.DS_Store"
    resources:
      - path: AsaCrowdsource/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaCrowdsource
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "家族のアイデア共有"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIBackgroundModes: "fetch remote-notification"
        OTHER_SWIFT_FLAGS: "$(inherited) -DFIREBASE_ENABLED"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore

  AsaCrowdsourceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AsaCrowdsourceTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: AsaCrowdsource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaCrowdsourceTests
        GENERATE_INFOPLIST_FILE: YES

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

schemes:
  AsaCrowdsource:
    build:
      targets:
        AsaCrowdsource: all
        AsaCrowdsourceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AsaCrowdsourceTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
