name: AsaFitnessCoach
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSHealthShareUsageDescription: "ワークアウトの進捗を追跡するために、HealthKitデータへのアクセスが必要です。"
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: "ワークアウトセッションを記録するために、HealthKitへの書き込みアクセスが必要です。"

targets:
  AsaFitnessCoach:
    type: application
    platform: iOS
    sources:
      - AsaFitnessCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaFitnessCoach
        INFOPLIST_KEY_CFBundleDisplayName: "AsaFitnessCoach"
        CODE_SIGN_ENTITLEMENTS: AsaFitnessCoach/AsaFitnessCoach.entitlements
    entitlements:
      path: AsaFitnessCoach/AsaFitnessCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  AsaFitnessCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AsaFitnessCoachTests
    dependencies:
      - target: AsaFitnessCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaFitnessCoachTests
