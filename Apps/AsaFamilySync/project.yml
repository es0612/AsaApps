name: AsaFamilySync
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaFamilySync:
    type: application
    platform: iOS
    sources:
      - AsaFamilySync
    resources:
      - AsaFamilySync/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asafamilysync
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_CFBundleDisplayName: "家族の予定同期"
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
      INFOPLIST_KEY_NSCalendarsUsageDescription: "カレンダーに家族の予定を同期するため"
      INFOPLIST_KEY_NSRemindersUsageDescription: "予定のリマインダーを設定するため"
      INFOPLIST_KEY_UIBackgroundModes: "fetch remote-notification"
      OTHER_SWIFT_FLAGS: "$(inherited) -DFIREBASE_ENABLED"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - sdk: Combine.framework
      - sdk: UserNotifications.framework
      - package: AsaUIKit
        product: AsaUIKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      # FirebaseFirestoreSwiftは不要（FirebaseFirestoreに統合済み）

  AsaFamilySyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaFamilySyncTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asafamilysync.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaFamilySync

  AsaFamilySyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaFamilySyncUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asafamilysync.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: AsaFamilySync
    dependencies:
      - target: AsaFamilySync

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0