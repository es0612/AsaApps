name: AsaEventLive
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  AsaEventLive:
    type: application
    platform: iOS
    sources:
      - AsaEventLive
    resources:
      - AsaEventLive/Assets.xcassets
    entitlements:
      path: AsaEventLive/AsaEventLive.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaeventlive
      INFOPLIST_FILE: AsaEventLive/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      SWIFT_VERSION: "5.9"
      OTHER_SWIFT_FLAGS: "$(inherited) -DFIREBASE_ENABLED"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - sdk: SwiftUI.framework

  AsaEventLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AsaEventLiveTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaeventlive.tests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
    dependencies:
      - target: AsaEventLive
