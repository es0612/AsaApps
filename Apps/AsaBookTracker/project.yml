name: AsaBookTracker
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Release
  developmentLanguage: ja

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AsaBookTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    
    sources:
      - path: AsaBookTracker
        excludes:
          - "**/.DS_Store"
    
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - framework: SwiftUI.framework
        embed: false
      - framework: SwiftData.framework
        embed: false
      - framework: Charts.framework
        embed: false
    
    settings:
      base:
        INFOPLIST_FILE: AsaBookTracker/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asabooktracker
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
      
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  AsaBookTracker:
    build:
      targets:
        AsaBookTracker: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release