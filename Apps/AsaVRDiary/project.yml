name: AsaVRDiary
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaVRDiary:
    type: application
    platform: iOS
    sources:
      - AsaVRDiary
    resources:
      - AsaVRDiary/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asavrdiary
      INFOPLIST_FILE: AsaVRDiary/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: SwiftUI.framework
      - sdk: RealityKit.framework
      - sdk: SwiftData.framework
      - sdk: Charts.framework

  AsaVRDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaVRDiaryTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asavrdiary.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaVRDiary

  AsaVRDiaryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaVRDiaryUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asavrdiary.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaVRDiary
