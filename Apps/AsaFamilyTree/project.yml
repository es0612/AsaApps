name: AsaFamilyTree
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "AsaFamilyTree"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit
  AsaFamilyTreeKit:
    path: ../../Packages/AsaFamilyTreeKit

targets:
  AsaFamilyTree:
    type: application
    platform: iOS
    sources:
      - AsaFamilyTree
    dependencies:
      - package: AsaUIKit
      - package: AsaFamilyTreeKit
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "プロフィール写真を選択するために写真ライブラリへのアクセスが必要です"

  AsaFamilyTreeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AsaFamilyTreeTests
    dependencies:
      - target: AsaFamilyTree
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
