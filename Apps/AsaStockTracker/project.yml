name: AsaStockTracker
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaStockTracker:
    type: application
    platform: iOS
    sources: 
      - AsaStockTracker
    resources:
      - AsaStockTracker/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asastocktracker
      INFOPLIST_FILE: AsaStockTracker/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: false
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - sdk: Charts.framework
      - package: AsaUIKit
        product: AsaUIKit

  AsaStockTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaStockTrackerTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asastocktracker.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaStockTracker

  AsaStockTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaStockTrackerUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asastocktracker.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaStockTracker

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit