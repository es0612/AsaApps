name: AsaQuoteWidget
options:
  bundleIdPrefix: com.asaapps
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  AsaQuoteWidget:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AsaQuoteWidget
      - Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaQuoteWidget
      INFOPLIST_FILE: AsaQuoteWidget/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: AsaQuoteWidget/AsaQuoteWidget.entitlements
    dependencies:
      - target: QuoteWidgetExtension
        embed: true
        codeSignOnCopy: true

  QuoteWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuoteWidgetExtension
      - Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.AsaQuoteWidget.QuoteWidgetExtension
      INFOPLIST_FILE: QuoteWidgetExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: QuoteWidgetExtension/QuoteWidgetExtension.entitlements
      SKIP_INSTALL: "YES"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  AsaQuoteWidget:
    build:
      targets:
        AsaQuoteWidget: all
        QuoteWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      
  QuoteWidgetExtension:
    build:
      targets:
        QuoteWidgetExtension: all
    run:
      config: Debug
      askForAppToLaunch: true