name: AsaChat
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaChat:
    type: application
    platform: iOS
    sources: 
      - AsaChat
      - ../../Shared
    resources:
      - AsaChat/Assets.xcassets
      - ../../Shared/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asachat
      INFOPLIST_FILE: AsaChat/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework

  AsaChatTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaChatTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asachat.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaChat

  AsaChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaChatUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asachat.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaChat