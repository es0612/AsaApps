name: AsaEventMap
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaEventMap:
    type: application
    platform: iOS
    sources: 
      - AsaEventMap
    resources:
      - AsaEventMap/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asaeventmap
      PRODUCT_NAME: AsaEventMap
      INFOPLIST_FILE: AsaEventMap/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: AsaEventMap
      INFOPLIST_KEY_CFBundleName: AsaEventMap
      INFOPLIST_KEY_CFBundleExecutable: AsaEventMap
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "AsaEventMapはイベントの位置を地図上に表示するために位置情報を使用します。"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework

  AsaEventMapTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaEventMapTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asaeventmap.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaEventMap

  AsaEventMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaEventMapUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asaeventmap.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaEventMap