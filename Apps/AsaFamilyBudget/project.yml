name: AsaFamilyBudget
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaFamilyBudget:
    type: application
    platform: iOS
    sources:
      - AsaFamilyBudget
    resources:
      - AsaFamilyBudget/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asafamilybudget
      INFOPLIST_FILE: AsaFamilyBudget/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_CFBundleDisplayName: "家族の予算"
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - sdk: SwiftData.framework
      - sdk: Charts.framework
      - package: AsaUIKit
        product: AsaUIKit

  AsaFamilyBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaFamilyBudgetTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asafamilybudget.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaFamilyBudget

  AsaFamilyBudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaFamilyBudgetUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asafamilybudget.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: AsaFamilyBudget
    dependencies:
      - target: AsaFamilyBudget

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit