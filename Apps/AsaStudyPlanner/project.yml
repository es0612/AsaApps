name: AsaStudyPlanner
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaStudyPlanner:
    type: application
    platform: iOS
    sources: [AsaStudyPlanner]
    resources: [AsaStudyPlanner/Assets.xcassets]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asastudyplanner
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_CFBundleDisplayName: "AsaStudyPlanner"
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AsaUIKit
        product: AsaUIKit
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework

  AsaStudyPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaStudyPlannerTests
    settings:
      GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: AsaStudyPlanner

  AsaStudyPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaStudyPlannerUITests
    settings:
      GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: AsaStudyPlanner
