name: AsaFlashcardPro
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaFlashcardPro:
    type: application
    platform: iOS
    sources: 
      - AsaFlashcardPro
    resources:
      - AsaFlashcardPro/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaflashcardpro
      INFOPLIST_FILE: AsaFlashcardPro/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework

  AsaFlashcardProTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaFlashcardProTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaflashcardpro.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaFlashcardPro

  AsaFlashcardProUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaFlashcardProUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asapapa.apps.asaflashcardpro.ui-tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaFlashcardPro