name: AsaLanguageLearn
options:
  bundleIdPrefix: com.asapapa.apps
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit

targets:
  AsaLanguageLearn:
    type: application
    platform: iOS
    sources:
      - AsaLanguageLearn
    settings:
      base:
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "発音練習のためにマイクを使用します"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "発音を認識してスコアを計算します"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: AsaUIKit
      - sdk: Speech.framework
      - sdk: AVFoundation.framework

  AsaLanguageLearnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AsaLanguageLearnTests
    dependencies:
      - target: AsaLanguageLearn

schemes:
  AsaLanguageLearn:
    build:
      targets:
        AsaLanguageLearn: all
    run:
      config: Debug
    test:
      targets:
        - AsaLanguageLearnTests
