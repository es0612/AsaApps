name: AsaTimeZone
options:
  bundleIdPrefix: com.asaapps
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Automatic

targets:
  AsaTimeZone:
    type: application
    platform: iOS
    sources:
      - AsaTimeZone
    resources:
      - AsaTimeZone/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asatimezone
      INFOPLIST_FILE: AsaTimeZone/Info.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_CFBundleDisplayName: "世界時計"
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Foundation.framework
      - package: AsaUIKit
        product: AsaUIKit

  AsaTimeZoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: AsaTimeZoneTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asatimezone.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AsaTimeZone

  AsaTimeZoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: AsaTimeZoneUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.asaapps.asatimezone.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: AsaTimeZone
    dependencies:
      - target: AsaTimeZone

packages:
  AsaUIKit:
    path: ../../Packages/AsaUIKit